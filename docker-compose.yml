services:
  openmc:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: arc-openmc
    volumes:
      # 시뮬레이션 결과 호스트 공유
      - ./runs:/app/runs
      # 다운로드한 핵데이터 마운트
      - ./nucdata:/data/nucdata
    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - OPENMC_CROSS_SECTIONS=/data/nucdata/endfb-viii.0-hdf5/cross_sections.xml
    stdin_open: true
    tty: true
